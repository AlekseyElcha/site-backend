events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;

    limit_req_zone $binary_remote_addr zone=one_limit:50m rate=30r/m;

    upstream fastapi_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name ask.domofon-servis-odi.ru;

        client_max_body_size 50M;

        # Переменная для проверки файла-флага
        set $maintenance_file /tmp/maintenance.on;
        set $maintenance_mode 0;

        if (-f $maintenance_file) {
            set $maintenance_mode 1;
        }

        # Проксируем API даже в режиме обслуживания, чтобы бэкенд мог работать
        location /auth {
            # Если режим обслуживания - возвращаем 503
            if ($maintenance_mode = 1) {
                return 503;
            }

            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /questions {
            if ($maintenance_mode = 1) {
                return 503;
            }

            limit_req zone=one_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /handle_questions {
            if ($maintenance_mode = 1) {
                return 503;
            }

            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /files {
            if ($maintenance_mode = 1) {
                return 503;
            }

            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location /dev/ {
            if ($maintenance_mode = 1) {
                return 503;
            }

            proxy_pass http://fastapi_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /dev;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Статические файлы отдаем всегда
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ТОЛЬКО ОДИН блок для заглушки!
        location = /maintainance.html {
            root /usr/share/nginx/html;
        }

        # Основной локейшн
        location / {
            root /usr/share/nginx/html;
            index index.html;

            # Если режим обслуживания - показываем заглушку
            if ($maintenance_mode = 1) {
                rewrite ^ /maintainance.html break;
            }

            try_files $uri $uri/ /index.html;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Страница ошибки 503
        error_page 503 /maintainance.html;
    }
}