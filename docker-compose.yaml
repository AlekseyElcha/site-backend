services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: questions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis_container:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - app-network

  redis_gui:
    image: redis/redisinsight
    ports:
      - "5540:5540"
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
#    ports:
#      - "8000:8000"
    ports:
      - "0.0.0.0:8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=questions
      - REDIS_HOST=redis_container
      - REDIS_PORT=6379
      - S3_ACCESS_KEY=${KEY_ID}
      - S3_SECRET_KEY=${SECRET}
      - S3_ENDPOINT_URL=${ENDPOINT}
      - S3_BUCKET_NAME=${CONTAINER}
    depends_on:
      - db
      - redis_container
    volumes:
      - ./src:/app/src
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
#    ports:
#      - "80:80"
    ports:
      - "0.0.0.0:8080:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge