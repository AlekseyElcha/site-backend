services:
  db:
    image: postgres:17-alpine  # alpine-образ легче
    environment:
      POSTGRES_DB: questions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c maintenance_work_mem=64MB
      -c work_mem=4MB
      -c max_connections=30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d questions"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis_container:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=questions
      - REDIS_HOST=redis_container
      - REDIS_PORT=6379
      - S3_ACCESS_KEY=${KEY_ID}
      - S3_SECRET_KEY=${SECRET}
      - S3_ENDPOINT_URL=${ENDPOINT}
      - S3_BUCKET_NAME=${CONTAINER}
    depends_on:
      db:
        condition: service_healthy
      redis_container:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge